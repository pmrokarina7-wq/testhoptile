item.vg-ferrolite.name = Ferrolite
item.vg-ferrolite.description = Rust-red iron ore. Extracted from slag by the mass separator.
item.vg-saltpeter.name = Saltpeter
item.vg-saltpeter.description = Oxidiser crystals for propellant.
item.vg-steel.name = Steel
item.vg-steel.description = Structural alloy for artillery and armour.
item.vg-charge.name = Propellant Charge
item.vg-charge.description = Volatile shell charge. Doubles Howl ammo and adds shrapnel.
block.vg-ore-ferrolite.name = Ferrolite Ore
block.vg-ore-saltpeter.name = Saltpeter Ore
block.vg-howl.name = Howl
block.vg-howl.description = T1 field mortar. Ground only, dead zone 6 tiles. Shells can be shot down by point defence.
block.vg-scorpion.name = Scorpion
block.vg-scorpion.description = T2 heavy artillery (ex Cybran LRA). Shells ignore point defence and are stopped only by shields.
block.vg-mass-separator.name = Mass Separator I
block.vg-mass-separator.description = Separates slag into ferrolite and saltpeter.
block.vg-steel-smelter.name = Steel Smelter
block.vg-steel-smelter.description = Ferrolite + coal → steel.
block.vg-propellant-press.name = Propellant Press
block.vg-propellant-press.description = Saltpeter + coal → 2 propellant charges.
block.vg-interceptor.name = Interceptor
block.vg-interceptor.description = Twin-laser point defence. Shoots down T1 shells and bullets.
block.vg-spotter-beacon.name = Spotter Beacon
block.vg-spotter-beacon.description = Reveals fog in a 25-tile radius and marks enemies inside it: marked targets take +25% damage. Needs power.
block.vg-shield-emitter.name = Shield Emitter
block.vg-shield-emitter.description = T1 shield dome. Absorbs any shell, including Scorpion.
block.vg-steel-wall.name = Steel Wall
block.vg-steel-wall-large.name = Large Steel Wall
unit.vg-acu-uef.name = Guardian ACU
unit.vg-acu-uef.description = UEF Armoured Command Unit. Spawned by the UEF command complex. Builds and mines; plasma cannon and missile pod; jump jets (boost). Overloads with a huge blast on death.
unit.vg-acu-cybran.name = Spectre ACU
unit.vg-acu-cybran.description = Cybran Armoured Command Unit. Faster and lighter: microwave laser and EMP prongs that shock targets. Overloads with a huge blast on death.
unit.vg-engineer.name = Engineer
unit.vg-engineer.description = Hover construction drone. Assists any construction nearby. Under a BKM core only ACUs and engineers can build.
block.vg-core-uef.name = UEF Command Complex
block.vg-core-uef.description = BKM core (4×4). Place over a Shard. You play as the Guardian ACU. Team rule: only ACUs and engineers can build.
block.vg-core-cybran.name = Cybran Nexus
block.vg-core-cybran.description = BKM core (4×4). Place over a Shard. You play as the Spectre ACU. Team rule: only ACUs and engineers can build.
block.vg-engineering-bay.name = Engineering Bay
block.vg-engineering-bay.description = Produces engineers.
status.vg-spotted.name = Spotted
status.vg-spotted.description = Marked by a spotter beacon: takes +25% damage.
item.vg-bauxite.name = Bauxite
item.vg-bauxite.description = Aluminium ore. Electrolysed into aluminium and chlorine.
item.vg-cobaltite.name = Cobaltite
item.vg-cobaltite.description = Blue cobalt ore for heat-resistant alloys.
item.vg-wolframite.name = Wolframite
item.vg-wolframite.description = Dense tungsten ore. Needs heat to process.
item.vg-neodymite.name = Neodymite
item.vg-neodymite.description = Rare-earth ore for permanent magnets.
item.vg-aluminum.name = Aluminium
item.vg-aluminum.description = Light metal. Cluster ammo for Redoubt.
item.vg-cobalt-alloy.name = Cobalt Alloy
item.vg-cobalt-alloy.description = Heat-resistant structural alloy for T3.
item.vg-tungsten-core.name = Tungsten Core
item.vg-tungsten-core.description = Armour-piercing penetrator. AP ammo for Mantis, heavy walls.
item.vg-magnet.name = Neodymium Magnet
item.vg-magnet.description = EMP ammo: shocks units and slows enemy buildings.
liquid.vg-chlorine.name = Chlorine
liquid.vg-chlorine.description = Corrosive gas, by-product of electrolysis. Used for magnets.
block.vg-ore-bauxite.name = Bauxite Ore
block.vg-ore-cobaltite.name = Cobaltite Ore
block.vg-ore-wolframite.name = Wolframite Ore
block.vg-ore-neodymite.name = Neodymite Ore
block.vg-mass-separator-2.name = Mass Separator II
block.vg-mass-separator-2.description = Separates slag into bauxite, cobaltite, wolframite and neodymite.
block.vg-bauxite-electrolyzer.name = Electrolyzer
block.vg-bauxite-electrolyzer.description = Bauxite → aluminium + chlorine gas.
block.vg-alloy-furnace.name = Alloy Furnace
block.vg-alloy-furnace.description = Cobaltite + steel + titanium + slag → cobalt alloy.
block.vg-heater.name = Heater
block.vg-heater.description = Burns propellant charges and outputs 6 heat forward.
block.vg-heat-conduit.name = Heat Conduit
block.vg-heat-conduit.description = Carries heat forward.
block.vg-tungsten-forge.name = Tungsten Forge
block.vg-tungsten-forge.description = Wolframite + graphite → tungsten core. Needs 6 heat; up to ×2 with more.
block.vg-magnet-factory.name = Magnet Factory
block.vg-magnet-factory.description = Neodymite + silicon + chlorine → neodymium magnet.
block.vg-percussion-drill.name = Impact Drill
block.vg-percussion-drill.description = T4 drill (3×3): mines thorium, wolframite and neodymite.
block.vg-redoubt.name = Redoubt
block.vg-redoubt.description = T2 fortified howitzer (UEF). 55 tiles, 3-round salvo. HE / incendiary / cluster. Shells ignore point defence — stopped by shields.
block.vg-mantis.name = Mantis
block.vg-mantis.description = T3 Cybran heavy artillery (Scathis-style drum). 95 tiles, 6-shell fan. HE / armour-piercing / EMP. Ignores point defence.
block.vg-lash.name = Lash
block.vg-lash.description = T2 Cybran pulse laser. Fast twin bolts, ground and air.
block.vg-hydra.name = Hydra
block.vg-hydra.description = T3 missile battery: 8 homing missiles per salvo. Magnet ammo = EMP.
block.vg-wasp.name = Wasp
block.vg-wasp.description = T3 anti-air missile battery. Air only.
block.vg-rivet.name = Rivet
block.vg-rivet.description = T1 twin machine gun. Steel rounds pierce armour.
block.vg-sparrow.name = Sparrow
block.vg-sparrow.description = T1 flak gun. Air only.
block.vg-decoy.name = Decoy
block.vg-decoy.description = Armoured dummy that enemy turrets and units prefer to target.
block.vg-wolfram-wall.name = Tungsten Wall
block.vg-wolfram-wall.description = Armour 15: shrugs off light bullets.
block.vg-wolfram-wall-large.name = Large Tungsten Wall
block.vg-wolfram-wall-large.description = Armour 15.
block.vg-recon-radar.name = Radar
block.vg-recon-radar.description = T3 radar: reveals fog in a 60-tile radius.
block.vg-ed-shield.name = ED Shield
block.vg-ed-shield.description = T2 shield dome, radius 9 tiles, 1000 HP. Stops Redoubt and Scorpion shells.
block.vg-pulse-shield.name = Pulse Shield
block.vg-pulse-shield.description = T3 shield dome, radius 14 tiles, 3500 HP.
block.vg-nanite-repairer.name = Nanite Repairer
block.vg-nanite-repairer.description = Repairs 14% of block health every 3.3 s in an 11-tile radius.
item.vg-iridite.name = Iridite
item.vg-iridite.description = Dense platinum-group ore from Mass Separator II.
item.vg-tritium-ice.name = Tritium Ice
item.vg-tritium-ice.description = Frozen fusion fuel. Slightly radioactive.
item.vg-iridium.name = Iridium
item.vg-iridium.description = T4 super-heavy metal. Monolith and Bastion ammo.
item.vg-superconductor.name = Superconductor
item.vg-superconductor.description = Cryo-cooled conductor for T4 tech.
liquid.vg-liquid-nitrogen.name = Liquid Nitrogen
liquid.vg-liquid-nitrogen.description = Extreme coolant. Needed for superconductors and fusion.
status.vg-disarmed.name = Disarmed
status.vg-disarmed.description = Weapons offline, 40% slower.
block.vg-monolith.name = Monolith
block.vg-monolith.description = T4 UEF strategic artillery. 170 tiles, 1600 damage in an 8-tile radius. Fires only with 20 heat (twice as fast at 40). Iridium cluster / tungsten AP / magnet EMP (disarms). Shells ignore point defence.
block.vg-bastion.name = Bastion
block.vg-bastion.description = T4 UEF railgun. 48 tiles, 1400 damage, pierces everything in line, hits air.
block.vg-suppressor.name = Suppressor
block.vg-suppressor.description = T4 Cybran EMP projector. 30 tiles, EMP radius 8 tiles: enemy units disarmed for 4 s, enemy buildings slowed and damaged.
block.vg-citadel.name = Citadel
block.vg-citadel.description = T4 shield dome: radius 18 tiles, 9000 HP. Holds Monolith-class shells.
block.vg-cryocondenser.name = Cryocondenser
block.vg-cryocondenser.description = Turns water and power into liquid nitrogen.
block.vg-iridium-smelter.name = Iridium Smelter
block.vg-iridium-smelter.description = Heat crafter (15 heat): iridite + cobalt alloy + plastanium → iridium.
block.vg-superconductor-chamber.name = Superconductor Chamber
block.vg-superconductor-chamber.description = Magnet + aluminium in liquid nitrogen → superconductor.
block.vg-plasma-heater.name = Plasma Heater
block.vg-plasma-heater.description = Burns tritium ice: 20 heat. Powers the Monolith and the iridium smelter.
block.vg-fusion-reactor.name = Fusion Reactor
block.vg-fusion-reactor.description = T4 tokamak: 2700 power/s from tritium ice + liquid nitrogen.
vg.buildrule = Only ACUs and engineers can build (BKM core rule)

# ---- 2.5.0-alpha2: T5 (Aeon technology)
item.vg-luminite.name = Luminite
item.vg-luminite.description = T5 green Aeon crystal. Found in rock veins on Seraphis; on Serpulo made by Mass Separator III.
item.vg-null-quartz.name = Null Quartz
item.vg-null-quartz.description = T5 crystal with zero-point lattice. Base of the quantum matrix.
item.vg-lumen-core.name = Lumen Core
item.vg-lumen-core.description = T5 light-forged core. Aegis, Halo and every Aeon structure need it.
item.vg-quantum-matrix.name = Quantum Matrix
item.vg-quantum-matrix.description = T5 resonant lattice. Tempest quantum shells and the Quantum Interceptor.
liquid.vg-lumen-ether.name = Lumen Ether
liquid.vg-lumen-ether.description = By-product of the Lumen Forge. Feeds Halo and is the best shield coolant.
liquid.vg-quantum-condensate.name = Quantum Condensate
liquid.vg-quantum-condensate.description = By-product of the Quantum Resonator. Fuel of the Quantum Generator; boosts the Laser Extractor.
status.vg-quantum-stasis.name = Quantum Stasis
block.vg-tempest.name = Tempest
block.vg-tempest.description = T5 UEF Disruptor artillery (8×8). 160 tiles, salvo of 4 × 1500. Fires only with 40 heat (×2 rate at 80). Quantum shells freeze units and buildings for 3 s and hit shields ×3. Cannot be intercepted except by the Seraphim Net (T6).
block.vg-halo.name = Halo
block.vg-halo.description = T5 Aeon anti-air ring (6×6). Continuous beam, ~1200 damage/s, air targets only, 75 tiles. Consumes lumen ether.
block.vg-quantum-interceptor.name = Quantum Interceptor
block.vg-quantum-interceptor.description = T5 counter-battery (4×4). Destroys one enemy T1–T4 shell every 1.5 s within 30 tiles, including shells that ordinary point defence cannot target.
block.vg-aegis.name = Aegis
block.vg-aegis.description = T5 Aeon shield dome (7×7). Radius 28 tiles, 50 000 strength, slow regeneration. Lumen ether makes it regenerate ~5× faster.
block.vg-luminite-wall.name = Luminite Shield Wall
block.vg-luminite-wall.description = T5 wall: 3500 HP, own 2000 shield, deflects reflectable bullets.
block.vg-luminite-wall-large.name = Large Luminite Shield Wall
block.vg-luminite-wall-large.description = T5 wall: 14 000 HP, own 8000 shield, deflects reflectable bullets.
block.vg-lumen-forge.name = Lumen Forge
block.vg-lumen-forge.description = Luminite + phase fabric → lumen core, by-product lumen ether.
block.vg-quantum-resonator.name = Quantum Resonator
block.vg-quantum-resonator.description = Null quartz + superconductor + surge alloy → quantum matrix, by-product quantum condensate.
block.vg-mass-separator-3.name = Mass Separator III
block.vg-mass-separator-3.description = Phase fabric + surge alloy + lots of power → luminite and null quartz.
block.vg-quantum-generator.name = Quantum Generator
block.vg-quantum-generator.description = Burns quantum condensate: 6000 power/s.
block.vg-laser-extractor.name = Laser Extractor
block.vg-laser-extractor.description = T5 beam drill (4×4): mines crystal veins in rock walls up to tier 7. Quantum condensate doubles the speed.
block.vg-wall-ore-luminite.name = Luminite Vein
block.vg-wall-ore-null-quartz.name = Null Quartz Vein
