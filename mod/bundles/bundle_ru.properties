item.vg-ferrolite.name = Феролит
item.vg-ferrolite.description = Ржаво-красная железная руда. Добывается из шлака масс-сепаратором.
item.vg-saltpeter.name = Селитра
item.vg-saltpeter.description = Кристаллы окислителя для порохового заряда.
item.vg-steel.name = Сталь
item.vg-steel.description = Конструкционный сплав для артиллерии и брони.
item.vg-charge.name = Пороховой заряд
item.vg-charge.description = Взрывоопасный заряд. Удваивает боезапас Howl и добавляет шрапнель.
block.vg-ore-ferrolite.name = Феролитовая руда
block.vg-ore-saltpeter.name = Селитряная руда
block.vg-howl.name = Вой
block.vg-howl.description = Т1 полевая мортира. Только наземные цели, мёртвая зона 6 клеток. Снаряды сбиваются точечной ПРО.
block.vg-scorpion.name = Скорпион
block.vg-scorpion.description = Т2 тяжёлая артиллерия (бывшая Cybran LRA). Снаряды не сбиваются ПРО — их держат только щиты.
block.vg-mass-separator.name = Масс-сепаратор I
block.vg-mass-separator.description = Разделяет шлак на феролит и селитру.
block.vg-steel-smelter.name = Сталеплавильня
block.vg-steel-smelter.description = Феролит + уголь → сталь, побочно железный расплав (если бак полон, сталеплавильня продолжает работать).
block.vg-propellant-press.name = Пороховой пресс
block.vg-propellant-press.description = Селитра + уголь → 2 пороховых заряда.
block.vg-interceptor.name = Перехватчик
block.vg-interceptor.description = Двухлазерная точечная ПРО. Сбивает снаряды Т1 и пули.
block.vg-spotter-beacon.name = Маяк корректировщика
block.vg-spotter-beacon.description = Открывает туман в радиусе 25 клеток и помечает врагов: помеченные цели получают +25% урона. Нужна энергия.
block.vg-shield-emitter.name = Эмиттер щита
block.vg-shield-emitter.description = Т1 купол-щит. Поглощает любые снаряды, включая Скорпион.
block.vg-steel-wall.name = Стальная стена
block.vg-steel-wall-large.name = Большая стальная стена
unit.vg-acu-uef.name = БКМ «Страж»
unit.vg-acu-uef.description = Бронированный командный модуль UEF. Появляется из Командного комплекса. Строит и добывает; плазменная пушка и ракетная установка; прыжковые двигатели (буст). При гибели — мощный взрыв.
unit.vg-acu-cybran.name = БКМ «Призрак»
unit.vg-acu-cybran.description = Бронированный командный модуль Кибран. Быстрее и легче: микроволновый лазер и ЭМИ-разрядник, оглушающий цели. При гибели — мощный взрыв.
unit.vg-engineer.name = Инженер
unit.vg-engineer.description = Строительный дрон на воздушной подушке. Сам помогает строить рядом. При ядре БКМ строить могут только БКМ и инженеры.
block.vg-core-uef.name = Командный комплекс UEF
block.vg-core-uef.description = Ядро БКМ (4×4). Ставится поверх «Осколка». Вы играете за БКМ «Страж». Правило команды: строить могут только БКМ и инженеры.
block.vg-core-cybran.name = Узел Кибран
block.vg-core-cybran.description = Ядро БКМ (4×4). Ставится поверх «Осколка». Вы играете за БКМ «Призрак». Правило команды: строить могут только БКМ и инженеры.
block.vg-engineering-bay.name = Инженерный цех
block.vg-engineering-bay.description = Производит инженеров.
status.vg-spotted.name = Помечен
status.vg-spotted.description = Помечен маяком корректировщика: получает +25% урона.
item.vg-bauxite.name = Боксит
item.vg-bauxite.description = Руда алюминия. Электролизом даёт алюминий и хлор.
item.vg-cobaltite.name = Кобальтит
item.vg-cobaltite.description = Синяя кобальтовая руда для жаропрочных сплавов.
item.vg-wolframite.name = Вольфрамит
item.vg-wolframite.description = Плотная вольфрамовая руда. Перерабатывается только с подводом тепла.
item.vg-neodymite.name = Неодимит
item.vg-neodymite.description = Редкоземельная руда для постоянных магнитов.
item.vg-aluminum.name = Алюминий
item.vg-aluminum.description = Лёгкий металл. Кассетные снаряды для «Редута».
item.vg-cobalt-alloy.name = Кобальтовый сплав
item.vg-cobalt-alloy.description = Жаропрочный сплав для построек Т3.
item.vg-tungsten-core.name = Вольфрамовый сердечник
item.vg-tungsten-core.description = Бронебойный сердечник. Бронебойные снаряды «Богомола», тяжёлые стены.
item.vg-magnet.name = Неодимовый магнит
item.vg-magnet.description = ЭМИ-боеприпас: оглушает юнитов и замедляет вражеские постройки.
liquid.vg-chlorine.name = Хлор
liquid.vg-chlorine.description = Едкий газ, побочный продукт электролиза. Нужен для магнитов.
block.vg-ore-bauxite.name = Бокситовая руда
block.vg-ore-cobaltite.name = Кобальтитовая руда
block.vg-ore-wolframite.name = Вольфрамитовая руда
block.vg-ore-neodymite.name = Неодимитовая руда
block.vg-mass-separator-2.name = Масс-сепаратор II
block.vg-mass-separator-2.description = Разделяет шлак на боксит, кобальтит, вольфрамит и неодимит.
block.vg-bauxite-electrolyzer.name = Электролизёр
block.vg-bauxite-electrolyzer.description = Боксит → алюминий + газ хлор.
block.vg-alloy-furnace.name = Сплавочная печь
block.vg-alloy-furnace.description = Кобальтит + сталь + титан + железный расплав → кобальтовый сплав. Одна сталеплавильня кормит одну печь.
block.vg-heater.name = Нагреватель
block.vg-heater.description = Сжигает пороховые заряды и выдаёт вперёд 6 ед. тепла.
block.vg-heat-conduit.name = Тепловод
block.vg-heat-conduit.description = Передаёт тепло вперёд.
block.vg-tungsten-forge.name = Вольфрамовый горн
block.vg-tungsten-forge.description = Вольфрамит + графит → вольфрамовый сердечник. Нужно 6 тепла, при избытке — до ×2.
block.vg-magnet-factory.name = Магнитная фабрика
block.vg-magnet-factory.description = Неодимит + кремний + хлор → неодимовый магнит.
block.vg-percussion-drill.name = Ударный бур
block.vg-percussion-drill.description = Бур Т4 (3×3): добывает торий, вольфрамит и неодимит.
block.vg-redoubt.name = Редут
block.vg-redoubt.description = Т2 укреплённая гаубица (UEF). 55 клеток, залп из 3 снарядов. Фугас / зажигательный / кассетный. Снаряды не сбиваются ПРО — их держат щиты.
block.vg-mantis.name = Богомол
block.vg-mantis.description = Т3 тяжёлая артиллерия Кибран (барабан в духе Scathis). 95 клеток, веер из 6 снарядов. Фугас / бронебойный / ЭМИ. Не сбивается ПРО.
block.vg-lash.name = Плеть
block.vg-lash.description = Т2 импульсный лазер Кибран. Быстрые парные заряды по земле и воздуху. Попадания вызывают коррозию: урон со временем, прочность −20%.
block.vg-hydra.name = Гидра
block.vg-hydra.description = Т3 ракетная батарея: 8 самонаводящихся ракет за залп. Магниты = ЭМИ.
block.vg-wasp.name = Оса
block.vg-wasp.description = Т3 зенитная ракетная батарея. Только воздух.
block.vg-rivet.name = Клёпка
block.vg-rivet.description = Т1 спаренный пулемёт. Стальные пули пробивают броню.
block.vg-sparrow.name = Воробей
block.vg-sparrow.description = Т1 зенитная пушка. Только воздух.
block.vg-decoy.name = Ложная цель
block.vg-decoy.description = Бронированная обманка: вражеские турели и юниты бьют её в первую очередь.
block.vg-wolfram-wall.name = Вольфрамовая стена
block.vg-wolfram-wall.description = Броня 15: лёгкие пули почти не наносят урона.
block.vg-wolfram-wall-large.name = Большая вольфрамовая стена
block.vg-wolfram-wall-large.description = Броня 15.
block.vg-recon-radar.name = Радар
block.vg-recon-radar.description = Т3 радар: открывает туман в радиусе 60 клеток.
block.vg-ed-shield.name = ЭД-щит
block.vg-ed-shield.description = Т2 купол-щит: радиус 9 клеток, 1000 ед. прочности. Держит снаряды «Редута» и «Скорпиона».
block.vg-pulse-shield.name = Импульсный щит
block.vg-pulse-shield.description = Т3 купол-щит: радиус 14 клеток, 3500 ед. прочности.
block.vg-nanite-repairer.name = Нанитовый ремонтник
block.vg-nanite-repairer.description = Каждые 3,3 с чинит 14% прочности построек в радиусе 11 клеток. Нанитовая взвесь усиливает: +8% ремонта, +5 клеток.
item.vg-iridite.name = Иридит
item.vg-iridite.description = Плотная руда платиновой группы. Даёт масс-сепаратор II.
item.vg-tritium-ice.name = Тритиевый лёд
item.vg-tritium-ice.description = Замороженное термоядерное топливо. Слабо радиоактивен.
item.vg-iridium.name = Иридий
item.vg-iridium.description = Т4 сверхтяжёлый металл. Снаряды «Монолита» и «Бастиона».
item.vg-superconductor.name = Сверхпроводник
item.vg-superconductor.description = Криоохлаждаемый проводник для Т4 техники.
liquid.vg-liquid-nitrogen.name = Жидкий азот
liquid.vg-liquid-nitrogen.description = Сверххладагент. Нужен для сверхпроводников и термояда.
status.vg-disarmed.name = Разоружён
status.vg-disarmed.description = Оружие отключено, скорость −40%.
block.vg-monolith.name = Монолит
block.vg-monolith.description = Т4 стратегическая артиллерия UEF. 170 клеток, 1600 урона в радиусе 8 клеток. Стреляет только при 20 ед. тепла (при 40 — вдвое быстрее). Иридиевый кассетный / вольфрамовый бронебойный / магнитный ЭМИ (разоружает). Не сбивается ПРО.
block.vg-bastion.name = Бастион
block.vg-bastion.description = Т4 рельсотрон UEF. 48 клеток, 1400 урона, прошивает всё на линии, бьёт по воздуху.
block.vg-suppressor.name = Подавитель
block.vg-suppressor.description = Т4 кибранский ЭМИ-проектор. 30 клеток, ЭМИ радиусом 8 клеток: вражеские юниты 4 с без оружия, постройки замедлены и повреждены.
block.vg-citadel.name = Цитадель
block.vg-citadel.description = Т4 купол-щит: радиус 18 клеток, 9000 ед. прочности. Держит снаряды класса «Монолит».
block.vg-cryocondenser.name = Криоконденсатор
block.vg-cryocondenser.description = Превращает воду и энергию в жидкий азот.
block.vg-iridium-smelter.name = Иридиевая плавильня
block.vg-iridium-smelter.description = Тепловой завод (15 тепла): иридит + кобальтовый сплав + пластаний → иридий.
block.vg-superconductor-chamber.name = Камера сверхпроводников
block.vg-superconductor-chamber.description = Магнит + алюминий в жидком азоте → сверхпроводник.
block.vg-plasma-heater.name = Плазменный нагреватель
block.vg-plasma-heater.description = Сжигает тритиевый лёд: 20 ед. тепла. Питает «Монолит» и иридиевую плавильню.
block.vg-fusion-reactor.name = Термоядерный реактор
block.vg-fusion-reactor.description = Т4 токамак: 2700 энергии/с из тритиевого льда и жидкого азота.
vg.buildrule = Строить могут только БКМ и инженеры (правило ядра БКМ)

# ---- 2.5.0-alpha2: Т5 (техника Эйон)
item.vg-luminite.name = Люминит
item.vg-luminite.description = Т5 зелёный кристалл Эйон. На Серафисе — жилы в скалах, на Серпуло его делает Масс-сепаратор III.
item.vg-null-quartz.name = Нуль-кварц
item.vg-null-quartz.description = Т5 кристалл с решёткой нулевой точки. Основа квантовой матрицы.
item.vg-lumen-core.name = Люмен-ядро
item.vg-lumen-core.description = Т5 ядро, кованное светом. Нужно Эгиде, Нимбу и всем постройкам Эйон.
item.vg-quantum-matrix.name = Квантовая матрица
item.vg-quantum-matrix.description = Т5 резонансная решётка. Квантовые снаряды Бури и Квантовый перехватчик.
liquid.vg-lumen-ether.name = Люмен-эфир
liquid.vg-lumen-ether.description = Побочный продукт Люмен-кузни. Питает Нимб и лучше всего охлаждает щиты.
liquid.vg-quantum-condensate.name = Квантовый конденсат
liquid.vg-quantum-condensate.description = Побочный продукт Квантового резонатора. Топливо Квантового генератора, ускоряет Лазерный экстрактор.
status.vg-quantum-stasis.name = Квантовый стазис
block.vg-tempest.name = Буря
block.vg-tempest.description = Т5 артиллерия UEF Disruptor (8×8). 160 клеток, залп 4 × 1500. Стреляет только при 40 ед. тепла (при 80 — вдвое быстрее). Квантовые снаряды замораживают юнитов и постройки на 3 с и бьют по щитам ×3. Сбить их может только Серафимская сеть (Т6).
block.vg-halo.name = Нимб
block.vg-halo.description = Т5 ПВО Эйон (6×6). Непрерывный луч ~1200 урона/с, только по воздуху, 75 клеток. Расходует люмен-эфир.
block.vg-quantum-interceptor.name = Квантовый перехватчик
block.vg-quantum-interceptor.description = Т5 противодействие (4×4). Уничтожает один вражеский снаряд Т1–Т4 раз в 1,5 с в радиусе 30 клеток, включая снаряды, которые обычная ПРО не видит.
block.vg-aegis.name = Эгида
block.vg-aegis.description = Т5 купол Эйон (7×7). Радиус 28 клеток, 50 000 прочности, медленно восстанавливается. С люмен-эфиром восстанавливается примерно в 5 раз быстрее.
block.vg-luminite-wall.name = Люминитовая щит-стена
block.vg-luminite-wall.description = Т5 стена: 3500 прочности, свой щит на 2000, отражает пули, которые можно отразить.
block.vg-luminite-wall-large.name = Большая люминитовая щит-стена
block.vg-luminite-wall-large.description = Т5 стена: 14 000 прочности, свой щит на 8000, отражает пули, которые можно отразить.
block.vg-lumen-forge.name = Люмен-кузня
block.vg-lumen-forge.description = Люминит + фазовая ткань → люмен-ядро, побочно люмен-эфир.
block.vg-quantum-resonator.name = Квантовый резонатор
block.vg-quantum-resonator.description = Нуль-кварц + сверхпроводник + кинетический сплав → квантовая матрица, побочно квантовый конденсат.
block.vg-mass-separator-3.name = Масс-сепаратор III
block.vg-mass-separator-3.description = Фазовая ткань + кинетический сплав + много энергии → люминит и нуль-кварц, а также серафит Т6 и (редко) сингулярит.
block.vg-quantum-generator.name = Квантовый генератор
block.vg-quantum-generator.description = Сжигает квантовый конденсат: 6000 энергии/с.
block.vg-laser-extractor.name = Лазерный экстрактор
block.vg-laser-extractor.description = Т5 лучевой бур (4×4): добывает кристаллические жилы в скалах до 7-го уровня. Квантовый конденсат ускоряет вдвое.
block.vg-wall-ore-luminite.name = Жила люминита
block.vg-wall-ore-null-quartz.name = Жила нуль-кварца
item.vg-seraphite.name = Серафит
item.vg-seraphite.description = Т6 кристалл пришельцев из руин Серафим. На Серпуло его делает Масс-сепаратор III.
item.vg-singularite.name = Сингулярит
item.vg-singularite.description = Т6 тёмный кристалл со схлопнутым ядром. Редкий, радиоактивный.
item.vg-seraphimium.name = Серафимий
item.vg-seraphimium.description = Т6 очищенный сплав Серафим. Нужен всем постройкам Т6.
item.vg-singular-core.name = Сингулярное ядро
item.vg-singular-core.description = Т6 удержанная сингулярность. Сингулярные снаряды Реквиема.
liquid.vg-antimatter.name = Антиматерия
liquid.vg-antimatter.description = Делает Антиматерийная ловушка. Топливо Реактора аннигиляции и цехов Т6, лучший охладитель щитов (Купол Серафим восстанавливается примерно вдвое быстрее).
status.vg-chrono-slow.name = Замедление времени
status.vg-chrono-slow.description = Внутри Хронополя: скорость и темп стрельбы −70%.
block.vg-requiem.name = Реквием
block.vg-requiem.description = Т6 артиллерия Серафим (10×10). 300 клеток, залп 3 × 4500, радиус 14. Стреляет только при 60 ед. тепла (при 120 — вдвое быстрее). Квантовые снаряды замораживают, сингулярные проходят сквозь любые щиты, кроме Купола Серафим. Сбить его снаряды может только Серафимская сеть.
block.vg-obelisk.name = Обелиск
block.vg-obelisk.description = Т6 луч Серафим (8×8). Непрерывный луч ~2500 урона/с по земле и воздуху, 70 клеток, пробивает 4 цели.
block.vg-seraphim-net.name = Серафимская сеть
block.vg-seraphim-net.description = Т6 противодействие (6×6). Уничтожает один вражеский снаряд раз в 4 с в радиусе 40 клеток — любой, включая снаряды Т5–Т6 и сингулярные. Расходует антиматерию.
block.vg-chronofield.name = Хронополе
block.vg-chronofield.description = Т6 поле времени (7×7). Вражеские юниты в радиусе 60 клеток двигаются и стреляют на 70% медленнее.
block.vg-seraphim-dome.name = Купол Серафим
block.vg-seraphim-dome.description = Т6 купол (9×9). Радиус 40 клеток, 150 000 прочности. Единственный щит, который держит сингулярные снаряды (они снимают ×4). С антиматерией как охладителем быстро восстанавливается.
block.vg-gravity-extractor.name = Гравитационный экстрактор
block.vg-gravity-extractor.description = Т6 бур (6×6): добывает любую руду на полу, включая руды Т6. Расходует антиматерию.
block.vg-antimatter-trap.name = Антиматерийная ловушка
block.vg-antimatter-trap.description = Квантовый конденсат + много энергии → антиматерия.
block.vg-seraphite-refinery.name = Серафитовый очиститель
block.vg-seraphite-refinery.description = Серафит + квантовая матрица + антиматерия → серафимий.
block.vg-singularity-collider.name = Сингулярный коллайдер
block.vg-singularity-collider.description = Сингулярит + серафимий + антиматерия → сингулярное ядро.
block.vg-annihilation-reactor.name = Реактор аннигиляции
block.vg-annihilation-reactor.description = Т6 энергия и тепло (7×7): сжигает антиматерию, 18 000 энергии/с и 60 ед. тепла в сторону выхода. Если его разрушить на ходу, он взрывается: 15 000 урона в радиусе 36 клеток, всем без разбора.
block.vg-ore-seraphite.name = Серафитовая руда
block.vg-ore-singularite.name = Сингуляритовая руда
liquid.vg-molten-iron.name = Железный расплав
liquid.vg-molten-iron.description = Побочный продукт сталеплавильни. Нужен сплавочной печи.
liquid.vg-nanite-slurry.name = Нанитовая взвесь
liquid.vg-nanite-slurry.description = Делает нанитовый чан. Усиливает нанитовый ремонтник, охлаждает щиты и турели Кибран лучше воды.
status.vg-corrosion.name = Коррозия
status.vg-corrosion.description = Коррозия Кибран: урон со временем, прочность −20%.
block.vg-prospector-drill.name = Бур «Добытчик»
block.vg-prospector-drill.description = Т1 стартовый бур (2×2). Копает руды на полу до 2-го уровня, на 25% быстрее механического.
block.vg-heat-engine.name = Тепловой генератор
block.vg-heat-engine.description = Т1 паровой генератор (2×2). Жжёт уголь, пороховой заряд или любое горючее: 90 энергии/с.
block.vg-hydrocarbon-plant.name = Гидроуглеродная станция
block.vg-hydrocarbon-plant.description = Т2 нефтяная турбина (3×3): 420 энергии/с из нефти.
block.vg-nanite-vat.name = Нанитовый чан
block.vg-nanite-vat.description = Т3 чан Кибран (3×3): кремний + споры + вода → нанитовая взвесь.
block.vg-lance-drill.name = Лучевой бур
block.vg-lance-drill.description = Т3 лучевой бур Кибран (3×3): добывает жилы в скалах до 5-го уровня (иридит, тритиевый лёд, бериллий, вольфрам) на 6 клеток вперёд. Вода ускоряет.
block.vg-heavy-driver.name = Масс-драйвер
block.vg-heavy-driver.description = Т4 масс-драйвер UEF (4×4): перебрасывает партии предметов на 120 клеток к другому масс-драйверу.
block.vg-cargo-hub.name = Грузовой узел
block.vg-cargo-hub.description = Т2 узел дронов (3×3): строит грузового дрона, который возит предметы в приёмники с тем же предметом — например, снаряды на передовую.
block.vg-cargo-receiver.name = Приёмник
block.vg-cargo-receiver.description = Т2 площадка для дронов (2×2). Выбери предмет — дроны из грузовых узлов будут привозить его сюда.
block.vg-wall-ore-iridite.name = Жила иридита
block.vg-wall-ore-tritium-ice.name = Жила тритиевого льда
